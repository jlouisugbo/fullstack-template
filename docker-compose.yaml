services:
  postgres:
    image: postgres:17
    container_name: sprint-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sprint
      POSTGRES_PASSWORD: sprint_dev
      POSTGRES_DB: sprint
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprint -d sprint"]
      interval: 5s
      retries: 5

volumes:
  postgres_data: